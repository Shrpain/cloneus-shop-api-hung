<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Gian hàng của Hưng</title>
<meta name="description" content="Đăng nhập tài khoản của bạn, về thẳng trang tài khoản.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f4f9;color:#182338;line-height:1.6;-webkit-text-size-adjust:100%}
  a{color:inherit}
  button{font-family:inherit}
  :focus-visible{outline:2px solid #ff8a00;outline-offset:2px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  .topbar{background:#ffb020;color:#241a00;font-weight:700;font-size:14px;text-align:center;padding:9px 12px}
  header{background:#0d1b33;color:#fff;position:sticky;top:0;z-index:20}
  .head{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:nowrap}
  .logo{font-size:21px;font-weight:800;text-decoration:none}
  .logo span{color:#ffb020}
  nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
  nav a{color:#dbe4f5;text-decoration:none;font-size:14px;padding:10px 10px;border-radius:8px;white-space:nowrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800;border-radius:12px;padding:13px 22px;font-size:15.5px;border:0;cursor:pointer;min-height:48px;white-space:nowrap}
  .btn-amber{background:linear-gradient(135deg,#ffb020,#ff8a00);color:#241a00}
  .btn-sm{padding:9px 16px;font-size:14px;min-height:44px}
  .btn:disabled{opacity:.6;cursor:wait}
  main{padding:36px 0 20px}
  .form-card{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e2e8f2;border-top:4px solid #ffb020;border-radius:18px;padding:28px}
  h1{font-size:clamp(24px,3.4vw,28px);margin:0 0 8px}
  .lead{color:#475569;font-size:15px;margin-bottom:20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
  .field input{width:100%;padding:14px;font-size:16px;border:1.5px solid #e2e8f2;border-radius:10px;font-family:inherit}
  .field input:focus{outline:none;border-color:#0d1b33}
  .form-card .btn{width:100%;margin-top:6px;min-height:52px;font-size:16.5px}
  .result{border-radius:12px;padding:16px 18px;font-size:15px;margin-top:18px;display:none}
  .result.error{display:block;background:#fdecec;border:1px solid #f3c1c1;color:#7a1d1d}
  .result a{font-weight:700;color:#0d1b33}
  .links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14.5px;margin-top:16px}
  .links a{font-weight:700;color:#0d1b33}
  footer{background:#0d1b33;color:#cdd8ec;margin-top:56px;padding:34px 0;font-size:13.5px}
  body{display:flex;flex-direction:column;min-height:100vh}footer{margin-top:auto}
  @media (max-width:860px){
    nav{display:flex;order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;margin-left:0}
    nav a{padding:12px 10px}
    .head{flex-wrap:wrap;row-gap:4px}
  }
  @media (max-width:560px){
    .form-card{padding:22px 20px}
    main{padding:28px 0 20px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <a class="logo" href="/">Hưng<span>·</span>CloneUS</a>
    <nav>
      <a href="/#san-pham">Tài khoản Muse AI</a>
      <a href="/#otp-gmail">Thuê OTP Gmail</a>
      <a href="/#huong-dan">Hướng dẫn</a>
      <a href="/#faq">Hỏi đáp</a>
    </nav>
    <a class="btn btn-amber btn-sm" href="/register.html">Đăng ký ngay</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="form-card">
      <h1>Đăng nhập</h1>
      <p class="lead">Đăng nhập bằng tài khoản bạn đã đăng ký trên trang này.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Tài khoản đăng nhập</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Tên tài khoản của bạn" aria-label="Tên tài khoản của bạn" required>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu" aria-label="Mật khẩu của bạn" required>
        </div>
        <button class="btn btn-amber" type="submit" id="submit-btn">Đăng nhập</button>
      </form>

      <div class="result error" id="result"></div>

      <div class="links">
        <span>Chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a></span>
        <a href="/#lien-he">Quên mật khẩu?</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <b style="color:#fff">Hưng · CloneUS</b>
    <p style="margin-top:6px">Gian hàng tài khoản Muse AI và thuê OTP.<br>Khách đăng ký và mua ngay trên shop này.</p>
  </div>
</footer>

<script>
var form = document.getElementById('login-form');
var resultBox = document.getElementById('result');
var submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', function (ev) {
  ev.preventDefault();
  resultBox.className = 'result';
  resultBox.innerHTML = '';
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  if (!username || !password) {
    resultBox.innerHTML = '<b>Chưa đăng nhập được.</b><br>Vui lòng nhập tên tài khoản và mật khẩu.';
    resultBox.className = 'result error';
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'Đang đăng nhập…';
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password }),
  }).then(function (r) { return r.json(); }).then(function (d) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Đăng nhập';
    if (d && d.status === 'success') {
      try {
        sessionStorage.setItem('hung_registration', JSON.stringify({ username: d.username }));
        try { localStorage.setItem('hung_username', d.username); } catch (e) {}
      } catch (e) {}
      window.location.href = '/account.html';
    } else {
      var msg = (d && d.message) || 'Tên tài khoản hoặc mật khẩu không đúng. Vui lòng kiểm tra lại.';
      resultBox.innerHTML = '<b>Đăng nhập chưa thành công.</b><br>' + msg;
      resultBox.className = 'result error';
    }
  }).catch(function () {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Đăng nhập';
    resultBox.innerHTML = '<b>Không kết nối được tới máy chủ.</b><br>Vui lòng thử lại sau.';
    resultBox.className = 'result error';
  });
});
</script>
</body>
</html>
